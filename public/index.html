<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Portfolio website of Kevin Lemniai - Full Stack Developer"
    />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Kevin Lemniai - Fullstack Developer</title>
    <meta
      name="description"
      content="Kevin Lemniai - Fullstack Developer. Portfolio, projects, and contact. Specialized in React, Node.js, and modern web technologies."
    />

    <!-- Google / Search Engine Tags -->
    <meta itemprop="name" content="Kevin Lemniai | Portfolio" />
    <meta
      itemprop="description"
      content="Professional portfolio showcasing full-stack development projects and expertise"
    />

    <!-- Google Analytics -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=%NEXT_PUBLIC_GA_ID%"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "%NEXT_PUBLIC_GA_ID%", {
        debug_mode: true,
        transport_url: "https://www.google-analytics.com",
        cookie_domain: "auto",
      });

      // Test event to verify tracking
      gtag("event", "test_event", {
        event_category: "testing",
        event_label: "initial_load",
        value: 1,
      });
    </script>

    <!-- Preload fonts -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Raleway:wght@500&display=swap"
      as="style"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Raleway:wght@500&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Raleway:wght@500&display=swap"
      />
    </noscript>

    <!-- Add font-display swap -->
    <style>
      @font-face {
        font-family: "Raleway";
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url(https://fonts.gstatic.com/s/raleway/v28/1Ptxg8zYS_SKggPN4iEgvnHyvveLxVvoor.woff2)
          format("woff2");
      }
    </style>

    <!-- Open Graph / Facebook -->
    <meta property="og:title" content="Kevin Lemniai - Fullstack Developer" />
    <meta
      property="og:description"
      content="Portfolio, projects, and contact. Specialized in React, Node.js, and modern web technologies."
    />
    <meta property="og:image" content="/images/og-image.jpg" />
    <meta property="og:url" content="https://kevinlemniai.fr/" />
    <meta property="og:type" content="website" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kevin Lemniai - Fullstack Developer" />
    <meta
      name="twitter:description"
      content="Portfolio, projects, and contact. Specialized in React, Node.js, and modern web technologies."
    />
    <meta name="twitter:image" content="/images/og-image.jpg" />
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
